# [порождено] Claude Code (Opus 5.5) по решениям пользователя, 2026-10-21.
# [принято] Проверено и принято мной.
#
# Онтология проекта «Анализ пульсовых волн»: классы, отношения, правила.
# Источник истины для графа проекта: по ней агент создаёт заметки классов в ontology/
# и связывает заметки объектов в notes/, tasks/, library/, runs/.
# Формат — week_4 practice.md; проверка — .venv\Scripts\python check_week4.py

ontology: анализ-пульсовых-волн
goal: >
  Две цели. Задачи: какие поручения поставлены, из каких подзадач состоят, в каком
  статусе и каким прогоном, проверкой или отчётом закрыты. Литература: агент отделяет
  утверждения из статей от результатов проекта, привязывает каждый тезис к странице
  источника, каждую формулу — к источнику и к коду, сверяет результаты прогонов
  модулятора с литературой. Граф читают пользователь, агент и рецензент.

competency_questions:
  - На какие источники и тезисы (страница, цитата) опирается метод модулятора и какие у него известные ограничения?
  - Какие формулы входят в метод, из какого источника взята каждая и в каком файле она реализована?
  - Какие результаты прогонов, на каких наборах данных, согласуются с литературой или противоречат ей, и чем они проверены?
  - Какие тезисы пользователь сверил по тексту источника?
  - Какие задачи поставлены, в каком они статусе, чем закрыты и на какие источники ссылаются отчёты?

classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, утверждение, данные, формула, метод, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — прогон, проверка
  Файл:
    parent: null
    definition: файл проекта — таблица, код, текст, переваренная статья в library/; узел графа — сам файл, заметка о нём не нужна
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Утверждение:
    parent: ИнформационныйОбъект
    definition: высказывание, которое может оказаться истинным или ложным
  Тезис:
    parent: Утверждение
    definition: утверждение, взятое из источника, — со страницей и дословной цитатой
  Результат:
    parent: Утверждение
    definition: утверждение, полученное в прогоне проекта, — с числом, единицами и условиями
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа; переваренная заметка — в library/, исходный PDF — в papers/
  Формула:
    parent: ИнформационныйОбъект
    definition: математическое соотношение с обозначениями и единицами величин
  Метод:
    parent: ИнформационныйОбъект
    definition: способ построения синтетического сигнала, обработки или разметки ФПГ
  НаборДанных:
    parent: ИнформационныйОбъект
    definition: таблица или серия записей ФПГ — реальные записи прибора или синтетический набор прогона
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известное отличие модели от реальных сигналов, дефект данных или условие применимости
  Отчёт:
    parent: ИнформационныйОбъект
    definition: текст о работе для читателя; заметка отчёта — сам файл отчёта
  Прогон:
    parent: Процесс
    definition: одно решение задачи бенчмарка в каталоге runs/tN-wX-rY/
  Проверка:
    parent: Процесс
    definition: проверка результата командой — что запущено и с каким исходом

properties:
  подзадачаОт:   {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:        {domain: [Прогон, Проверка], range: Задача}
  выполняет:     {domain: Отчёт, range: Задача}
  утверждаетсяВ: {domain: Тезис, range: Источник}
  взятаИз:       {domain: Формула, range: Источник}
  основанНа:     {domain: Метод, range: [Источник, Тезис]}
  включает:      {domain: Метод, range: Формула}
  применяет:     {domain: Прогон, range: Метод}
  использует:    {domain: Прогон, range: НаборДанных}
  порождает:     {domain: Прогон, range: НаборДанных}
  даёт:          {domain: Прогон, range: Результат}
  проверенЧерез: {domain: Результат, range: Проверка}
  согласуетсяС:  {domain: Результат, range: Тезис}
  противоречит:  {domain: Результат, range: Тезис}
  ограничивает:  {domain: Ограничение, range: [Метод, НаборДанных, Результат]}
  описывает:     {domain: Отчёт, range: [Прогон, Результат]}
  ссылаетсяНа:   {domain: Отчёт, range: Источник}
  хранитсяВ:     {domain: [Источник, НаборДанных, Результат], range: Файл}
  реализованВ:   {domain: [Формула, Метод, Прогон, Проверка], range: Файл}

# Атрибуты — поле в начале заметки со значением из списка.
attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]
  сверка:
    domain: Тезис
    values: [не сверен, сверен пользователем, расходится]

rules:
  - id: П1
    text: Каждый тезис взят из источника.
    dl: "Тезис ⊑ ∃утверждаетсяВ.Источник"
    check: {kind: some, class: Тезис, property: утверждаетсяВ, target: Источник}
  - id: П2
    text: В заметке тезиса есть раздел «Цитата» — страница и дословный текст источника.
    dl: "— (правило оформления, проверяется по тексту заметки)"
    check: {kind: section, class: Тезис, section: Цитата}
  - id: П3
    text: Каждая формула взята из источника; формула без источника — сигнал, что её придумал агент.
    dl: "Формула ⊑ ∃взятаИз.Источник"
    check: {kind: some, class: Формула, property: взятаИз, target: Источник}
  - id: П4
    text: Каждый источник указывает на свою переваренную заметку в library/.
    dl: "Источник ⊑ ∃хранитсяВ.Файл"
    check: {kind: some, class: Источник, property: хранитсяВ, target: Файл}
  - id: П5
    text: Каждый результат получен в каком-то прогоне.
    dl: "Результат ⊑ ∃даёт⁻.Прогон"
    check: {kind: some_inverse, class: Результат, property: даёт, source: Прогон}
  - id: П6
    text: Результат не может одновременно согласовываться с тезисом и противоречить ему.
    dl: "DisjointObjectProperties(согласуетсяС противоречит)"
    check: {kind: disjoint_properties, properties: [согласуетсяС, противоречит]}
  - id: П7
    text: Сверенный тезис — тезис, который пользователь сверил по тексту источника.
    dl: "СверенныйТезис ≡ Тезис ⊓ ∃сверка.{сверен пользователем}"
    check: {kind: defined_value, name: СверенныйТезис, class: Тезис, attribute: сверка, values: [сверен пользователем]}
  - id: П8
    text: Проверенный результат — результат, прошедший хотя бы одну проверку.
    dl: "ПроверенныйРезультат ≡ Результат ⊓ ∃проверенЧерез.Проверка"
    check: {kind: defined, name: ПроверенныйРезультат, class: Результат, property: проверенЧерез, target: Проверка}
  - id: П9
    text: Каждый отчёт ссылается хотя бы на один источник.
    dl: "Отчёт ⊑ ∃ссылаетсяНа.Источник"
    check: {kind: some, class: Отчёт, property: ссылаетсяНа, target: Источник}
  - id: П10
    text: Выполненная задача — задача со статусом «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check: {kind: defined_value, name: ВыполненнаяЗадача, class: Задача, attribute: status, values: [выполнена, принята]}
  - id: П11
    text: Выполненную задачу закрывает прогон, проверка или отчёт либо у неё есть подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∃решает⁻.⊤ ⊔ ∃выполняет⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤"
    check: {kind: some_inverse_any, class: ВыполненнаяЗадача, properties: [решает, выполняет, подзадачаОт]}
  - id: П12
    text: Задача выполнена, только если выполнены все её подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check: {kind: all_inverse, class: ВыполненнаяЗадача, property: подзадачаОт, source: ВыполненнаяЗадача}
  - id: П13
    text: В заметке выполненной задачи есть раздел «Итог» — что сделано и чем проверено.
    dl: "— (правило оформления, проверяется по тексту заметки)"
    check: {kind: section, class: ВыполненнаяЗадача, section: Итог}
